<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Practice</title>
    <link rel="stylesheet" href="4.1_demo.css">
</head>
<body>

    <!-- BOX MODEL -->
    <section class="box-model">
        <div class="card">
            <div class="icon">🌿</div>

            <div>
                <h2>Green Planet</h2>
                <p>Let's make our earth a better place to live.</p>
                <p>Every action counts!</p>
            </div>
        </div>
    </section>

    <!-- POSITIONING -->
    <section class="positioning">

        <div class="parent">

            <div class="box top-left">
                Top Left
            </div>

            <div class="box center">
                Center
            </div>

            <div class="box bottom-right">
                Bottom Right
            </div>

        </div>

    </section>

    <!-- FLEXBOX LAYOUT -->
    <section class="website">

        <header>
            <h2>MySite</h2>

            <nav>
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </nav>
        </header>

        <main>

            <div class="card-item">
                <h3>HTML</h3>
                <p>Structure the content.</p>
            </div>

            <div class="card-item">
                <h3>CSS</h3>
                <p>Style the content.</p>
            </div>

            <div class="card-item">
                <h3>JavaScript</h3>
                <p>Add interactivity.</p>
            </div>

        </main>

        <footer>
            © 2026 MySite. All rights reserved.
        </footer>

    </section>

</body> 
</html>
