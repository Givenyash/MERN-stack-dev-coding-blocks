<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>
    <link rel="stylesheet" href="netfilx.css">
</head>
<body>

    <div class="overlay">

        <nav>
            <h1>NETFLIX</h1>
        </nav>

        <div class="hero">

            <h2 id="welcome">
                Unlimited Movies, TV Shows and More
            </h2>

            <p>Watch anywhere. Cancel anytime.</p>

            <input
                type="text"
                id="username"
                placeholder="Enter Your Name"
            >

            <br><br>

            <button id="welcomeBtn">Update Welcome</button>

            <button id="themeBtn">Change Theme</button>

            <button id="showBtn">Show Movies</button>

            <button id="browserBtn">Browser Info</button>

        </div>

        <div id="movies" class="movies">

            <div class="card">Stranger Things</div>

            <div class="card">Money Heist</div>

            <div class="card">Wednesday</div>

        </div>

    </div>

    <script src="netflix.js"></script>

</body>
</html>
