<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Card Slider</title>
    <link rel="stylesheet" href="7.1_image_style.css">
</head>

<body>

    <div class="container">


        <div class="card-stack">

            <div class="card top">
                <img src="car_image.jpeg" alt="">
            </div>

            <div class="card upper">
                <img src="img12.jpeg" alt="">
            </div>

            <div class="card active">
                <img src="img123.jpeg" alt="">
            </div>

            <div class="card lower">
                <img src="img1234.jpg" alt="">
            </div>

            <div class="card bottom">
                <img src="new_task.jpeg" alt="">
            </div>

        </div>


        <div class="content">

            <div class="buttons">
                <button>⬆️</button>
                <button>⬇️</button>
            </div>

            <h1>Luffy kun</h1>

            <div class="designation">
                <span></span>
                <p>MARKETING MANAGER</p>
                <span></span>
            </div>

            <div class="dots">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span class="active-dot"></span>
                <span></span>
            </div>

        </div>

    </div>

</body>
</html>
