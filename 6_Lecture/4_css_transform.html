<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box{
            transition: 2s;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box:hover{
            transform: scale(2);
            background-color: aqua;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <div class="box">
        Yash
    </div>
</body>
</html>
