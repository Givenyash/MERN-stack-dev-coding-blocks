<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--Image tag-->
    <h2>Image tag</h2>
    <img src="bmw-m4-competition.jpeg" alt="BMW M4 competition" width="700" height="500">

    <!--video tag-->
    <h2>Video tag</h2>
    <video src="video1.mp4" width="500" height="550"></video>

     <!--audio tag-->
     <h2>Audio tag</h2>
    <audio src="audio1.mp3" controls> Your browser does not support this Audio</audio>

    <!--iframe tag-->
    <h2>iframe tag</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/8hatQ0GNTZc?si=eGHRU2Unkp4yGxHn" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <!--embed tag-->
    <h2>embed tag</h2>
    <embed src="https://www.slideshare.net/slideshow/striver-sde-sheet-1pdf/252007948?utm_source=clipboard_share_button&utm_campaign=slideshare_make_sharing_viral_v2&utm_variation=variant&utm_medium=share" type="pdf" title="Resume" width="500" height="500">

    <!--Object tag-->
    <h2>object tag</h2>

    <object
  type="video/webm"
  data="/shared-assets/videos/flower.webm"
  width="600"
  height="140">
  <img
    src="/shared-assets/images/examples/flowers.jpg"
    alt="Some beautiful flowers" />
</object>

</body>
</html>
