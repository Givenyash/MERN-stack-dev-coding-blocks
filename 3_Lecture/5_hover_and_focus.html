<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover and Focus</title>

    <style>
        .aa:hover{
            background-color: aquamarine;
        }

        #as:hover{
            background-color: rgb(103, 189, 17);
        }

        .aa:focus{
            color: rgb(241, 41, 6) ;
        }
        
        a:visited{
            background: #b04c74;
        }
        
    </style>

</head>
<body>
    <button class="aa">
        Send
    </button>

    <button id="as">
        Submit
    </button>

    <a href="https://www.google.com">Google link</a>
</body>
</html>
