<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Box model</title>

    <style>
        h1{
            margin-top: 30%;
            border: solid black;
        }

        div{
            margin: 100px 50px;
            border: solid black;
        }
    </style>

</head>
<body>
    <h1>Hello Css Box</h1>
    <div>This is Box</div>
</body>
