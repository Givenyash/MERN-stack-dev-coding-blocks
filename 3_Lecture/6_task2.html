<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html + Css task</title>

    <style>
        .card{
            margin-left: 68vh;
            width: 35vw;
        }

        img{
            display: block;
            height: 25vw;
            width: 100%;
        }
        
        h2{
            text-align: center; 
            color: hotpink;
            margin-bottom: 0vh;
            margin-right: 10px;
        }

        h1{
            text-align: center;
            font-size: 3vw;
            margin-top: 0vh;
            margin-right: 5px;
        }

         p{
            text-align: center;
            font-size: larger;
        }

        table{
            margin: 0 auto;
            font-family: 'Times New Roman', Times, serif;
            color: rgb(229, 218, 227);
            background-color: rgb(239, 127, 146);
            border: 1px solid rgb(225, 120, 138);
            border-collapse: collapse;
            font-size: 18px;
        }

        table th{
            padding: 1px 20px 4px 20px;
            text-align: center;
            border: 1px solid rgb(225, 120, 138);
            line-height: normal;
        }

        .ch{
            font-size: 10px;
            display: block;
            margin-top: -2px;
        }

    </style>
</head>
<body>
  
  <div class="card">
    <img src="Mount-Everest.jpeg" alt="Mount-Everest Image">

    <h2>4 days ago</h2>
    <h1> <b>Post One</b> </h1>

    <p>Lorem ipsum dolor amet consectetur <br>adipisicing elit. Eveniet, inventore <br> nesciunt. neque repellat, dignissimos <br>ratione</p>

    <table>
        <tr>
            <th>4 <sup>m</sup> <span class="ch">READ</span></th>
            <th> 5123 <span class="ch">VIEWS</span></th>
            <th>32 <span class="ch">COMMENTS</span></th>
        </tr>
    </table>
  </div>

</body>
</html>
